<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Chatus Admin</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="admin-body">
    <section class="login-view" id="adminLoginView" hidden>
      <form class="login-panel" id="adminLoginForm">
        <div class="brand-mark">A</div>
        <h1>Admin</h1>
        <label for="adminToken">管理 Token</label>
        <input id="adminToken" name="adminToken" type="password" autocomplete="current-password" required />
        <button type="submit">进入后台</button>
        <p class="status-line" id="adminLoginStatus" role="status"></p>
      </form>
    </section>

    <section class="admin-view" id="adminView" hidden>
      <header class="admin-header">
        <div>
          <strong>Chatus Admin</strong>
          <span id="adminSourceText">读取中</span>
        </div>
        <nav>
          <a class="ghost-button compact" href="/">聊天页</a>
          <button class="ghost-button compact" id="refreshAdminButton" type="button">刷新</button>
          <button class="plain-button compact" id="adminLogoutButton" type="button">退出</button>
        </nav>
      </header>

      <main class="admin-grid">
        <section class="admin-panel stats-panel">
          <div class="panel-title">
            <h2>今日用量</h2>
            <span id="statsDay">--</span>
          </div>
          <div class="stats-list" id="statsList"></div>
        </section>

        <section class="admin-panel">
          <div class="panel-title">
            <h2>用户模型</h2>
            <span>按朋友配置线路和额度</span>
          </div>
          <form class="admin-form" id="userForm">
            <div class="form-grid">
              <label>
                用户
                <select id="userSelect"></select>
              </label>
              <label>
                新用户 label
                <input id="newUserLabel" autocomplete="off" placeholder="例如 alice" />
              </label>
              <label>
                默认线路
                <select id="userDefaultRoute"></select>
              </label>
              <label>
                每日额度
                <input id="userDailyLimit" type="number" min="1" step="1" />
              </label>
              <label>
                每分钟额度
                <input id="userMinuteLimit" type="number" min="1" step="1" />
              </label>
              <label class="check-line">
                <input id="userByok" type="checkbox" />
                允许朋友填写自己的 API Key
              </label>
            </div>
            <div class="checkbox-grid" id="allowedRoutesBox"></div>
            <div class="form-actions">
              <button class="ghost-button compact" type="submit">保存用户</button>
              <button class="plain-button compact" id="deleteUserButton" type="button">删除用户配置</button>
            </div>
          </form>
        </section>

        <section class="admin-panel">
          <div class="panel-title">
            <h2>线路模型</h2>
            <span>API Key 建议只填 apiKeyRef</span>
          </div>
          <form class="admin-form" id="routeForm">
            <div class="form-grid">
              <label>
                选择线路
                <select id="routeAdminSelect"></select>
              </label>
              <label>
                线路 ID
                <input id="routeIdInput" autocomplete="off" placeholder="line-a" required />
              </label>
              <label>
                显示名称
                <input id="routeLabelInput" autocomplete="off" placeholder="主线路" />
              </label>
              <label>
                接口类型
                <select id="routeTypeInput">
                  <option value="openai-chat">OpenAI Chat</option>
                  <option value="anthropic-messages">Anthropic Messages</option>
                </select>
              </label>
              <label class="wide-field">
                Base URL
                <input id="routeBaseUrlInput" autocomplete="off" placeholder="https://example.com/v1" required />
              </label>
              <label>
                模型名
                <input id="routeModelInput" autocomplete="off" placeholder="model-name" required />
              </label>
              <label>
                API Key Ref
                <input id="routeKeyRefInput" autocomplete="off" placeholder="LINE_A_KEY" />
              </label>
              <label>
                Fallbacks
                <input id="routeFallbacksInput" autocomplete="off" placeholder="line-b,line-c" />
              </label>
              <label class="check-line">
                <input id="routeImagesInput" type="checkbox" checked />
                支持图片
              </label>
              <label class="check-line">
                <input id="routeRequiresKeyInput" type="checkbox" />
                必须由朋友填写 Key
              </label>
            </div>
            <div class="form-actions">
              <button class="ghost-button compact" type="submit">保存线路</button>
              <button class="plain-button compact" id="deleteRouteButton" type="button">删除线路</button>
            </div>
          </form>
        </section>

        <section class="admin-panel">
          <div class="panel-title">
            <h2>访问码</h2>
            <span id="accessSourceText">Secret</span>
          </div>
          <textarea class="admin-textarea small" id="accessCodesInput" spellcheck="false"></textarea>
          <div class="form-actions">
            <button class="ghost-button compact" id="saveAccessCodesButton" type="button">保存访问码</button>
            <button class="plain-button compact" id="resetAccessCodesButton" type="button">恢复 Secret</button>
          </div>
        </section>

        <section class="admin-panel json-panel">
          <div class="panel-title">
            <h2>高级配置 JSON</h2>
            <span id="configSourceText">Secret</span>
          </div>
          <textarea class="admin-textarea" id="configJsonInput" spellcheck="false"></textarea>
          <div class="form-actions">
            <button class="ghost-button compact" id="saveConfigButton" type="button">保存 JSON</button>
            <button class="plain-button compact" id="resetConfigButton" type="button">恢复 Secret</button>
          </div>
        </section>
      </main>
      <p class="admin-status" id="adminStatus" role="status"></p>
    </section>

    <script src="/admin.js" type="module"></script>
  </body>
</html>
