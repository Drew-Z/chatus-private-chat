name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check frontend
        run: npm run check:frontend

      - name: Test
        run: npm test

      - name: Prepare Worker secrets
        env:
          UPSTREAM_API_KEY: ${{ secrets.UPSTREAM_API_KEY }}
          ACCESS_CODES: ${{ secrets.ACCESS_CODES }}
          ROUTES_CONFIG: ${{ secrets.ROUTES_CONFIG }}
          SYSTEM_PROMPT: ${{ secrets.SYSTEM_PROMPT }}
          BLOCKED_PROMPTS: ${{ secrets.BLOCKED_PROMPTS }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ROUTE_KEYS_MASTER_KEY: ${{ secrets.ROUTE_KEYS_MASTER_KEY }}
          WORKER_SECRETS_JSON: ${{ secrets.WORKER_SECRETS_JSON }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          if (!process.env.ACCESS_CODES) {
            throw new Error("ACCESS_CODES GitHub secret is required");
          }
          if (!process.env.ROUTES_CONFIG && !process.env.UPSTREAM_API_KEY) {
            throw new Error("Set ROUTES_CONFIG for multi-route mode, or UPSTREAM_API_KEY for legacy mode");
          }
          if (process.env.ROUTES_CONFIG) {
            JSON.parse(process.env.ROUTES_CONFIG);
          }
          if (process.env.ROUTE_KEYS_MASTER_KEY) {
            const normalized = process.env.ROUTE_KEYS_MASTER_KEY.trim();
            const decoded = Buffer.from(normalized, "base64");
            if (decoded.length !== 32 || decoded.toString("base64") !== normalized) {
              throw new Error("ROUTE_KEYS_MASTER_KEY must be Base64-encoded 32 random bytes");
            }
          }
          const extraSecrets = process.env.WORKER_SECRETS_JSON
            ? JSON.parse(process.env.WORKER_SECRETS_JSON)
            : {};
          if (
            extraSecrets === null ||
            Array.isArray(extraSecrets) ||
            typeof extraSecrets !== "object"
          ) {
            throw new Error("WORKER_SECRETS_JSON must be a JSON object when set");
          }

          const keys = [
            "ACCESS_CODES",
            "ROUTES_CONFIG",
            "UPSTREAM_API_KEY",
            "SYSTEM_PROMPT",
            "BLOCKED_PROMPTS",
            "ADMIN_TOKEN",
            "ROUTE_KEYS_MASTER_KEY",
          ];
          const secrets = Object.fromEntries(
            keys
              .filter((key) => process.env[key])
              .map((key) => [key, process.env[key]]),
          );
          for (const [key, value] of Object.entries(extraSecrets)) {
            if (!/^[A-Z][A-Z0-9_]*$/.test(key)) {
              throw new Error(`Invalid Worker secret name in WORKER_SECRETS_JSON: ${key}`);
            }
            if (typeof value !== "string" || !value) {
              throw new Error(`Worker secret ${key} must be a non-empty string`);
            }
            secrets[key] = value;
          }
          fs.writeFileSync(".prod.secrets.json", JSON.stringify(secrets, null, 2));
          NODE

      - name: Prepare release metadata
        run: |
          node - <<'NODE'
          const fs = require("fs");
          fs.writeFileSync(
            "public/release.json",
            JSON.stringify({ commit: process.env.GITHUB_SHA, deployedAt: new Date().toISOString() }),
          );
          for (const file of ["public/index.html", "public/admin.html"]) {
            const source = fs.readFileSync(file, "utf8");
            if (!source.includes('meta name="chatus-release" content="development"')) {
              throw new Error(`${file} is missing the release meta placeholder`);
            }
            fs.writeFileSync(
              file,
              source
                .replace('meta name="chatus-release" content="development"', `meta name="chatus-release" content="${process.env.GITHUB_SHA}"`)
                .replaceAll("?v=development", `?v=${process.env.GITHUB_SHA}`),
            );
          }
          const appFile = "public/app.js";
          const appSource = fs.readFileSync(appFile, "utf8");
          if (!appSource.includes("?v=development")) {
            throw new Error(`${appFile} is missing the asset version placeholder`);
          }
          fs.writeFileSync(appFile, appSource.replaceAll("?v=development", `?v=${process.env.GITHUB_SHA}`));
          NODE

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for attempt in 1 2 3; do
            if npx wrangler deploy --secrets-file .prod.secrets.json; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Wrangler deploy failed after 3 attempts"
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Wrangler deploy attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Verify production
        run: npm run smoke:production -- https://chatus.ciallobill.qzz.io "$GITHUB_SHA"

      - name: Remove prepared secrets
        if: always()
        run: rm -f .prod.secrets.json
