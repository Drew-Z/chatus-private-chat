name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatus-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CHATUS_WORKER_NAME: ${{ vars.CHATUS_WORKER_NAME }}
      CHATUS_KV_NAMESPACE_ID: ${{ vars.CHATUS_KV_NAMESPACE_ID }}
      CHATUS_PRODUCTION_URL: ${{ vars.CHATUS_PRODUCTION_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Refuse a stale main revision
        shell: bash
        run: |
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$remote_sha" ] || [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Refusing to deploy a revision that is no longer the main branch tip"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check frontend
        run: npm run check:frontend

      - name: Test
        run: npm test

      - name: Prepare deployment configuration and Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPSTREAM_API_KEY: ${{ secrets.UPSTREAM_API_KEY }}
          ACCESS_CODES: ${{ secrets.ACCESS_CODES }}
          ROUTES_CONFIG: ${{ secrets.ROUTES_CONFIG }}
          SYSTEM_PROMPT: ${{ secrets.SYSTEM_PROMPT }}
          BLOCKED_PROMPTS: ${{ secrets.BLOCKED_PROMPTS }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ROUTE_KEYS_MASTER_KEY: ${{ secrets.ROUTE_KEYS_MASTER_KEY }}
          WORKER_SECRETS_JSON: ${{ secrets.WORKER_SECRETS_JSON }}
        run: npm run prepare:deployment

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config .wrangler.deploy.jsonc

      - name: Prepare release metadata
        run: |
          node - <<'NODE'
          const fs = require("fs");
          fs.writeFileSync(
            "public/release.json",
            JSON.stringify({ commit: process.env.GITHUB_SHA, deployedAt: new Date().toISOString() }),
          );
          for (const file of ["public/index.html", "public/admin.html", "public/react-chat/index.html", "public/legacy/index.html"]) {
            const source = fs.readFileSync(file, "utf8");
            if (!source.includes('meta name="chatus-release" content="development"')) {
              throw new Error(`${file} is missing the release meta placeholder`);
            }
            fs.writeFileSync(
              file,
              source
                .replace('meta name="chatus-release" content="development"', `meta name="chatus-release" content="${process.env.GITHUB_SHA}"`)
                .replaceAll("?v=development", `?v=${process.env.GITHUB_SHA}`),
            );
          }
          const appFile = "public/app.js";
          const appSource = fs.readFileSync(appFile, "utf8");
          if (!appSource.includes("?v=development")) {
            throw new Error(`${appFile} is missing the asset version placeholder`);
          }
          fs.writeFileSync(appFile, appSource.replaceAll("?v=development", `?v=${process.env.GITHUB_SHA}`));
          NODE

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for attempt in 1 2 3; do
            if npx wrangler deploy --config .wrangler.deploy.jsonc --secrets-file .prod.secrets.json; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Wrangler deploy failed after 3 attempts"
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Wrangler deploy attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Verify production
        env:
          PRODUCTION_URL: ${{ vars.CHATUS_PRODUCTION_URL }}
        run: npm run smoke:production -- "$PRODUCTION_URL" "$GITHUB_SHA"

      - name: Remove prepared deployment files
        if: always()
        run: rm -f .prod.secrets.json .wrangler.deploy.jsonc
