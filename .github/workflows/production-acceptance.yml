name: Production member acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatus-production-mutation
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployed revision before acceptance
        id: release
        continue-on-error: true
        env:
          PRODUCTION_URL: ${{ vars.CHATUS_PRODUCTION_URL }}
        run: npm run smoke:production -- "$PRODUCTION_URL" "$GITHUB_SHA"

      - name: Run temporary-member acceptance
        id: acceptance
        if: steps.release.outcome == 'success'
        continue-on-error: true
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          PRODUCTION_URL: ${{ vars.CHATUS_PRODUCTION_URL }}
        run: npm run acceptance:production

      - name: Write acceptance manifest
        if: always()
        env:
          DELIVERY_STATUS: release=${{ steps.release.outcome }},acceptance=${{ steps.acceptance.outcome }}
        run: |
          mkdir -p artifacts/production-acceptance
          node scripts/write-delivery-manifest.mjs --kind production-acceptance --status "$DELIVERY_STATUS" --output artifacts/production-acceptance/manifest.json

      - name: Retain production-acceptance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-${{ github.sha }}
          path: artifacts/production-acceptance/manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce acceptance result
        if: always() && (steps.release.outcome != 'success' || steps.acceptance.outcome != 'success')
        run: exit 1
