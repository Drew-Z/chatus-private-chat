name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatus-production-mutation
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.classify.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify deployment paths
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p artifacts/path-classification
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/classify-ci-paths.mjs --all --github-output "$GITHUB_OUTPUT" --manifest artifacts/path-classification/paths.json
          elif [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git diff-tree --root --no-commit-id --name-only -r "$HEAD_SHA" | node scripts/classify-ci-paths.mjs --github-output "$GITHUB_OUTPUT" --manifest artifacts/path-classification/paths.json
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" | node scripts/classify-ci-paths.mjs --github-output "$GITHUB_OUTPUT" --manifest artifacts/path-classification/paths.json
          fi

      - name: Retain deployment path classification
        uses: actions/upload-artifact@v4
        with:
          name: deployment-paths-${{ github.sha }}
          path: artifacts/path-classification/paths.json
          retention-days: 30

  deployment-skipped:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.deploy != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record docs and Trellis-only skip
        run: echo "Deployment skipped because this commit changes only documentation or tracked Trellis records." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      CHATUS_WORKER_NAME: ${{ vars.CHATUS_WORKER_NAME }}
      CHATUS_KV_NAMESPACE_ID: ${{ vars.CHATUS_KV_NAMESPACE_ID }}
      CHATUS_PRODUCTION_URL: ${{ vars.CHATUS_PRODUCTION_URL }}
    steps:
      - name: Checkout deployment revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refuse a stale main revision
        shell: bash
        run: |
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$remote_sha" ] || [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Refusing to deploy a revision that is no longer the main branch tip"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check:frontend

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Check merged diff whitespace
        run: git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"

      - name: Prepare deployment configuration and Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPSTREAM_API_KEY: ${{ secrets.UPSTREAM_API_KEY }}
          ACCESS_CODES_MODE: managed
          ROUTES_CONFIG: ${{ secrets.ROUTES_CONFIG }}
          SYSTEM_PROMPT: ${{ secrets.SYSTEM_PROMPT }}
          BLOCKED_PROMPTS: ${{ secrets.BLOCKED_PROMPTS }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ROUTE_KEYS_MASTER_KEY: ${{ secrets.ROUTE_KEYS_MASTER_KEY }}
          WORKER_SECRETS_JSON: ${{ secrets.WORKER_SECRETS_JSON }}
        run: npm run prepare:deployment

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config .wrangler.deploy.jsonc

      - name: Prepare release metadata
        run: |
          node - <<'NODE'
          const fs = require("fs");
          fs.writeFileSync(
            "public/release.json",
            JSON.stringify({ commit: process.env.GITHUB_SHA, deployedAt: new Date().toISOString() }),
          );
          for (const file of ["public/index.html", "public/admin.html", "public/react-chat/index.html", "public/legacy/index.html"]) {
            const source = fs.readFileSync(file, "utf8");
            if (!source.includes('meta name="chatus-release" content="development"')) {
              throw new Error(`${file} is missing the release meta placeholder`);
            }
            fs.writeFileSync(
              file,
              source
                .replace('meta name="chatus-release" content="development"', `meta name="chatus-release" content="${process.env.GITHUB_SHA}"`)
                .replaceAll("?v=development", `?v=${process.env.GITHUB_SHA}`),
            );
          }
          const appFile = "public/app.js";
          const appSource = fs.readFileSync(appFile, "utf8");
          if (!appSource.includes("?v=development")) {
            throw new Error(`${appFile} is missing the asset version placeholder`);
          }
          fs.writeFileSync(appFile, appSource.replaceAll("?v=development", `?v=${process.env.GITHUB_SHA}`));
          NODE

      - name: Refuse a stale main revision before deploy
        shell: bash
        run: |
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$remote_sha" ] || [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Refusing to deploy a revision that is no longer the main branch tip"
            exit 1
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for attempt in 1 2 3; do
            if npx wrangler deploy --config .wrangler.deploy.jsonc --secrets-file .prod.secrets.json; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Wrangler deploy failed after 3 attempts"
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Wrangler deploy attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Verify production
        env:
          PRODUCTION_URL: ${{ vars.CHATUS_PRODUCTION_URL }}
        run: npm run smoke:production -- "$PRODUCTION_URL" "$GITHUB_SHA"

      - name: Write deployment manifest
        if: always()
        env:
          DELIVERY_STATUS: ${{ job.status }}
        run: |
          mkdir -p artifacts/deployment
          node scripts/write-delivery-manifest.mjs --kind production-deployment --status "$DELIVERY_STATUS" --output artifacts/deployment/manifest.json

      - name: Retain deployment manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-${{ github.sha }}
          path: artifacts/deployment/manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove prepared deployment files
        if: always()
        run: rm -f .prod.secrets.json .wrangler.deploy.jsonc
